name: Publish TrayFix v1.1 Release

on:
  push:
    branches:
      - fix/tray-nested-latency-8726
    paths:
      - .github/workflows/publish-trayfix-release.yml

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  TAG_NAME: v2.6.0-trayfix-v1.1
  RELEASE_TITLE: Clash Verge Rev v2.6.0 TrayFix v1.1
  SOURCE_RUN_ID: "45366091520"
  TARGET_SHA: a8d4cb7122d9f872f9b600fc7f663275be5f22e7

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download successful Windows x64 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Clash-Verge-TrayFix-Windows-x64" \
            --dir release-assets
          ls -lah release-assets

      - name: Prepare checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"
          test -n "$EXE"
          EXE_NAME="$(basename "$EXE")"
          (cd "$(dirname "$EXE")" && sha256sum "$EXE_NAME") > release-assets/SHA256SUMS.txt

          cat > release-notes.md <<'EOF'
          ## Clash Verge Rev v2.6.0 TrayFix v1.1

          基于 Clash Verge Rev **v2.6.0 / dev** 构建的 Windows x64 自定义补丁版。

          ### v1.1 新增 / 优化

          - 保留 v1.0 的托盘嵌套代理组递归延迟显示：沿代理组当前 `now` 逐级解析到最终实际节点，并显示最终节点已有延迟。
          - `DIRECT` 改为通过 Mihomo delay API 获取真实直连延迟，并在托盘中显示具体毫秒值。
          - `DIRECT` 测速结果全局共享并缓存 60 秒，避免每个策略组重复发起相同测速。
          - `DIRECT` 测速复用 Clash Verge Rev 的默认延迟测试 URL 和超时设置；失败或超时显示「超时」。
          - `REJECT`、`REJECT-DROP`、`PASS`、`PassRule`、`COMPATIBLE`、`DNS` 等非测速型特殊出口不再显示无意义的 `| -ms`。
          - 普通代理节点从未获得延迟数据时仍显示 `-ms`；已有测速记录但结果为无效/超时时显示「超时」。

          ### 显示示例

          ```text
          YouTube
            节点选择   | 245ms
            自动选择   | 179ms
            DIRECT     | 35ms

          广告拦截
            REJECT
            DIRECT     | 35ms
          ```

          ### 实现范围

          - 不修改 Dashboard 的现有测速行为。
          - 不修改 Mihomo 的选路逻辑。
          - 不修改 XBoard / ClashMeta 订阅模板。
          - 嵌套代理组解析仍有最大深度限制，避免异常循环引用。

          ### 关联

          - 上游功能请求：clash-verge-rev/clash-verge-rev#8726
          - 构建分支：`fix/tray-nested-latency-8726`
          - 功能提交：`a8d4cb7122d9f872f9b600fc7f663275be5f22e7`
          - Windows x64 NSIS：GitHub Actions Run #45366091520

          ### 安装包

          `Clash.Verge_2.6.0_x64-setup_trayfix_v1.1.exe`

          > 这是自定义补丁构建，并非 clash-verge-rev 官方发布版本。
          EOF

      - name: Create GitHub Release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets with --clobber."
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$EXE" \
            release-assets/SHA256SUMS.txt \
            --clobber

      - name: Show release URL
        shell: bash
        run: |
          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,name \
            --jq '{name: .name, tag: .tagName, url: .url}'
