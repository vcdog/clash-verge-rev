name: Publish TrayFix v1.3 Release

on:
  push:
    branches:
      - fix/tray-nested-latency-8726
    paths:
      - .github/workflows/publish-trayfix-release.yml

permissions: write-all

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG_NAME: v2.6.0-trayfix-v1.3
  RELEASE_TITLE: Clash Verge Rev v2.6.0 TrayFix v1.3
  SOURCE_RUN_ID: "45411456793"
  TARGET_SHA: 5696935bc9ee636e5913f1044309fc16a13d422f

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository for tag publication
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or reuse release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
          else
            git tag "$TAG_NAME" "$TARGET_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Download successful Windows x64 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Clash-Verge-TrayFix-Windows-x64" \
            --dir release-assets
          ls -lah release-assets

      - name: Prepare checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"
          test -n "$EXE"
          EXE_NAME="$(basename "$EXE")"
          (cd "$(dirname "$EXE")" && sha256sum "$EXE_NAME") > release-assets/SHA256SUMS.txt

          cat > release-notes.md <<'EOF'
          ## Clash Verge Rev v2.6.0 TrayFix v1.3

          基于 Clash Verge Rev **v2.6.0 / dev** 构建的 Windows x64 自定义补丁版。

          ### v1.3 修复

          - 修复国内网络环境下 `DIRECT` 直连延迟经常显示「超时」的问题。
          - `DIRECT` 改用更适合国内网络的直连探针，并并发取最先返回的有效结果。
          - `DIRECT` 测速单次等待时间缩短，继续保留 60 秒缓存，避免频繁重复测速。

          ### 延续 v1.2 功能

          - 客户端延迟测试结果会同步到系统托盘。
          - 托盘优先显示客户端最近一次真实测速结果。
          - 嵌套代理组递归显示最终实际节点延迟。
          - 同一节点的延迟可在不同策略组之间复用。
          - `REJECT`、`REJECT-DROP`、`PASS`、`PassRule`、`COMPATIBLE`、`DNS` 等非测速型出口不再显示无意义的 `| -ms`。
          - 普通节点没有测速结果时仍显示 `-ms`。

          ### 预期效果

          ```text
          节点选择
            自动选择                  | 179ms
            DIRECT                    | 18ms
            奥地利⑤ᴴ²                | 245ms
            美国④ᵛ                   | 212ms

          广告拦截
            REJECT
            DIRECT                    | 18ms
          ```

          ### 关联

          - 上游功能请求：clash-verge-rev/clash-verge-rev#8726
          - 构建分支：`fix/tray-nested-latency-8726`
          - 发布提交：`5696935bc9ee636e5913f1044309fc16a13d422f`
          - Windows x64 NSIS：GitHub Actions Run #45411456793

          ### 安装包

          `Clash.Verge_2.6.0_x64-setup_trayfix_v1.3.exe`

          > 这是自定义补丁构建，并非 clash-verge-rev 官方发布版本。
          EOF

      - name: Create GitHub Release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets with --clobber."
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$EXE" \
            release-assets/SHA256SUMS.txt \
            --clobber

      - name: Show release URL
        shell: bash
        run: |
          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,name \
            --jq '{name: .name, tag: .tagName, url: .url}'
