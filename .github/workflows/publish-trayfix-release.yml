name: Publish TrayFix v1.0 Release

on:
  push:
    branches:
      - fix/tray-nested-latency-8726
    paths:
      - .github/workflows/publish-trayfix-release.yml

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  TAG_NAME: v2.6.0-trayfix-v1.0
  RELEASE_TITLE: Clash Verge Rev v2.6.0 TrayFix v1.0
  SOURCE_RUN_ID: "45345613066"
  TARGET_SHA: e931938e94f8d613e0500fa0c316f0ebc9a510c3

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download successful Windows x64 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Clash-Verge-TrayFix-Windows-x64" \
            --dir release-assets
          ls -lah release-assets

      - name: Prepare checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"
          test -n "$EXE"
          EXE_NAME="$(basename "$EXE")"
          (cd "$(dirname "$EXE")" && sha256sum "$EXE_NAME") > release-assets/SHA256SUMS.txt

          cat > release-notes.md <<'EOF'
          ## Clash Verge Rev v2.6.0 TrayFix v1.0

          基于 Clash Verge Rev **v2.6.0 / dev** 构建的 Windows x64 自定义补丁版。

          ### 新增补丁功能

          修复托盘菜单中嵌套代理组显示 `-ms` 的问题。

          当托盘中的菜单项本身是 `select`、`url-test`、`fallback` 等代理组时，会沿该组当前的 `now` 选择递归解析，直到找到最终实际代理节点，并显示该节点已有的最近一次延迟。

          示例：

          ```text
          YouTube
            节点选择   | 191ms
            自动选择   | 208ms
            DIRECT     | -ms
          ```

          ### 实现范围

          - 只读取 Mihomo 已存在的代理组选择状态和节点延迟历史。
          - 不新增托盘测速请求。
          - 不修改 Dashboard 的测速行为。
          - 不修改测速 URL、前端延迟缓存或 Mihomo 选路逻辑。
          - 嵌套代理组解析设置最大递归深度，避免异常循环引用。
          - 不需要修改 XBoard / ClashMeta 订阅模板。

          ### 关联

          - 上游功能请求：clash-verge-rev/clash-verge-rev#8726
          - 构建分支：`fix/tray-nested-latency-8726`
          - Windows x64 NSIS 安装包由 GitHub Actions Run #45345613066 构建成功。

          ### 安装包

          `Clash.Verge_2.6.0_x64-setup_trayfix_v1.0.exe`

          > 这是自定义补丁构建，并非 clash-verge-rev 官方发布版本。
          EOF

      - name: Create GitHub Release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets with --clobber."
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$EXE" \
            release-assets/SHA256SUMS.txt \
            --clobber

      - name: Show release URL
        shell: bash
        run: |
          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,name \
            --jq '{name: .name, tag: .tagName, url: .url}'
